<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Evidence Tracer</title>
<meta name="description" content="Checks each sentence of a draft brief against the court record, links it to the page that supports it, and flags wrong details, wrong cites and facts the record does not contain, for a lawyer to accept or fix.">
<style>
.head{padding:8px 0 0}
.head h1{margin:40px 0 14px}
.head .lead{max-width:40em}
.verdict{margin:36px 0 0;border:1px solid var(--rule);border-radius:16px;background:#fbfaf6;overflow:hidden}
.vhead{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:8px 24px;padding:18px 24px;border-bottom:1px solid var(--rule)}
.vhead h2{all:unset;font:400 22px/1.2 var(--serif)}
.vhead p{margin:0;color:var(--ink-2);font-size:15px}
.vhead p b{color:var(--ink)}
.vrow{display:grid;grid-template-columns:minmax(0,15em) minmax(0,1fr) 7.5em 5.5em;align-items:center;gap:20px;padding:22px 24px}
.vrow+.vrow{border-top:1px solid var(--rule-soft)}
.vwho b{display:block;font:400 20px/1.2 var(--serif)}
.vwho span{display:block;color:var(--ink-2);font-size:14px;line-height:1.4;margin-top:4px}
.strip{display:grid;grid-template-columns:repeat(20,minmax(0,1fr));gap:4px}
.cell{display:block;aspect-ratio:1;border-radius:4px;border:1.5px solid transparent;padding:0;cursor:pointer;transition:transform .2s var(--ease),box-shadow .2s}
.cell.pass{background:var(--green)}
.cell.fail{background:var(--paper);border-color:var(--ink)}
.cell.crit{background:var(--ink)}
.cell:hover,.cell:focus-visible,.cell.lit{transform:translateY(-3px);box-shadow:0 6px 12px -6px rgb(27 26 23/.5)}
.vscore b{font:400 44px/1 var(--serif)}
.vscore span{display:block;color:var(--ink-2);font-size:13px;line-height:1.35;margin-top:4px}
.gate{justify-self:end;display:inline-flex;align-items:center;justify-content:center;min-height:32px;padding:0 14px;border-radius:999px;font:500 13px/1 var(--mono);letter-spacing:.06em}
.gate.go{background:var(--green-wash);color:var(--green)}
.gate.nogo{background:var(--ink);color:var(--paper)}
.gate.partial{border:1.5px dashed var(--ink);color:var(--ink)}
.legend{display:flex;flex-wrap:wrap;gap:6px 20px;padding:14px 24px;border-top:1px solid var(--rule);color:var(--ink-2);font-size:13px}
.legend span{display:inline-flex;align-items:center;gap:8px}
.legend i{width:12px;height:12px;border-radius:3px;border:1.5px solid transparent}
.legend .pass{background:var(--green)}.legend .fail{border-color:var(--ink)}.legend .crit{background:var(--ink)}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 270px;gap:56px;align-items:start;margin-top:8px}
.side{position:sticky;top:24px;margin-top:64px;display:grid;gap:22px;font-size:14px;color:var(--ink-2)}
.side h3{margin:0 0 6px;font:500 13px/1.3 var(--sans);color:var(--ink)}
.side p{margin:0}
.side nav a{display:block;padding:5px 0;color:var(--ink-2);text-decoration:none;border-bottom:1px solid var(--rule-soft)}
.side nav a:hover{color:var(--ink)}
.side pre{font-size:12px;margin:6px 0 0;white-space:pre-wrap}
.point{font-size:17px;max-width:40em}
.seg{display:flex;width:fit-content;max-width:100%;flex-wrap:wrap;gap:2px;padding:3px;border:1px solid var(--rule);border-radius:999px;margin:0 0 14px;background:#fbfaf6}
.seg button{min-height:34px;padding:0 13px;border:0;border-radius:999px;background:transparent;color:var(--ink-2);font:500 14px/1 var(--sans);cursor:pointer}
.seg button span{font-weight:400;opacity:.8}
.seg button[aria-checked=true]{background:var(--ink);color:var(--paper)}
@media (max-width:1000px){
 .layout{grid-template-columns:minmax(0,1fr);gap:0}
 .side{position:static;margin-top:48px}
 .vrow{grid-template-columns:minmax(0,1fr) auto;gap:14px 16px}
 .vrow .strip{grid-column:1/-1;grid-row:2}
 .vscore{grid-row:3}.vrow .gate{grid-row:3}
}
@media (max-width:640px){.vrow{padding:18px}.vhead{padding:16px 18px}.strip{gap:3px}}
@media (prefers-reduced-motion:reduce){.cell{transition:none}}

/* ---- page-specific ---- */
.work{margin:32px 0 0;border:1px solid var(--rule);border-radius:16px;background:#fbfaf6;display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);min-height:560px;overflow:hidden}
.pane{padding:20px 22px;min-width:0}
.pane+.pane{border-left:1px solid var(--rule)}
.ph{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:6px 16px;margin:0 0 12px}
.ph h2{all:unset;font:400 20px/1.2 var(--serif)}
.ph p{margin:0;color:var(--ink-2);font-size:13px}
.brief{max-height:620px;overflow:auto;padding-right:6px}
.para{margin:0 0 14px;line-height:1.75;font-size:15px}
.sent{all:unset;cursor:pointer;border-radius:4px;padding:1px 2px;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.sent:hover{background:var(--rule-soft)}
.sent:focus-visible{outline:2px solid var(--ink);outline-offset:1px}
.sent.on{color:var(--ink);background:var(--green-wash);box-shadow:0 0 0 1.5px var(--green)}
.sent.dim{opacity:.32}
.sent .ct{font-family:var(--mono);font-size:12px;color:var(--ink-2)}
.mk{display:inline-block;width:9px;height:9px;border-radius:2px;margin:0 5px 1px 0;vertical-align:middle;border:1.5px solid var(--ink)}
.mk.supported{background:var(--green);border-color:var(--green)}
.mk.cite_fix{background:repeating-linear-gradient(135deg,var(--green) 0 2px,transparent 2px 4px);border-color:var(--green)}
.mk.needs_fix{background:var(--paper)}
.mk.unsupported{background:var(--ink)}
.mk.needs_review{background:var(--paper);border-style:dashed}
.badge{display:inline-flex;align-items:center;gap:6px;font:500 12px/1 var(--mono);letter-spacing:.04em;padding:6px 10px;border-radius:999px;border:1px solid var(--rule)}
.badge.supported{background:var(--green-wash);color:var(--green);border-color:transparent}
.badge.cite_fix{color:var(--green);border:1.5px dashed var(--green)}
.badge.needs_fix{border:1.5px solid var(--ink);color:var(--ink)}
.badge.unsupported{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.badge.needs_review{border:1.5px dashed var(--ink)}
.det h3{font:400 20px/1.35 var(--serif);margin:12px 0 8px}
.det .lbl{font:500 12px/1 var(--mono);color:var(--ink-2);margin:18px 0 6px;letter-spacing:.04em}
.det blockquote{margin:0 0 10px;padding:10px 12px;border:1px solid var(--rule);border-radius:10px;background:var(--paper);font-size:14px;line-height:1.55}
.det blockquote mark{background:var(--green-wash);color:var(--ink);padding:0 1px;border-radius:2px}
.det blockquote cite{display:block;font:400 12px/1 var(--mono);color:var(--ink-2);margin-top:8px;font-style:normal}
.det .txt{font-size:15px;line-height:1.55;margin:0}
.det .fix{border:1.5px solid var(--ink);border-radius:10px;padding:10px 12px;background:var(--paper)}
.det .note{font-size:14px;color:var(--ink-2);margin:10px 0 0}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
.acts button,.btn{min-height:36px;padding:0 14px;border:1px solid var(--ink);border-radius:999px;background:transparent;color:var(--ink);font:500 14px/1 var(--sans);cursor:pointer}
.acts button[aria-pressed=true]{background:var(--ink);color:var(--paper)}
.acts textarea{width:100%;min-height:70px;font:400 14px/1.5 var(--sans);border:1px solid var(--rule);border-radius:10px;padding:8px 10px;background:var(--paper);color:var(--ink);box-sizing:border-box}
.foot{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px 16px;margin-top:18px;padding-top:14px;border-top:1px solid var(--rule-soft);font-size:13px;color:var(--ink-2)}
.slegend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--ink-2);margin:10px 0 0}
.map{width:100%;height:auto;display:block}
.map text{font:400 11px var(--mono);fill:var(--ink-2)}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th,.tbl td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--rule-soft);vertical-align:top}
.tbl th{font:500 12px/1.2 var(--mono);color:var(--ink-2)}
.scroll{overflow-x:auto}
.steps{padding-left:1.2em;max-width:42em}
.steps li{margin:0 0 8px}
@media (max-width:860px){.work{grid-template-columns:minmax(0,1fr)}.pane+.pane{border-left:0;border-top:1px solid var(--rule)}.brief{max-height:380px}}
</style></head><body><main>
<div id="root"></div>
</main><script type="module" src="./src/main.tsx"></script></body></html>
