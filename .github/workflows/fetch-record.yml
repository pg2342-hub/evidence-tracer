name: Fetch the court record

# Downloads the public opinion, splits it into pages with pdftotext, and commits data/record/.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -q && sudo apt-get install -y -q poppler-utils
      - run: python3 scripts/fetch_record.py
      - name: Commit the record
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/record
          git commit -m "Fetch the court record" || echo "nothing to commit"
          git push
